[project]
name = "toronto-beaches-ecoli"
version = "0.1.0"
description = "How often Toronto's beaches exceed the E. coli swimming limit, and how well the daily sign matches the water, 2007 to 2026"
readme = "README.md"
authors = [
    { name = "Sean Murphy", email = "seandata8@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.3",
    "pointblank>=0.27.0",
    "polars>=1.44.2",
    "pyarrow>=25.0.1",
    "statsmodels>=0.15.0",
]

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "contextily>=1.7.1",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "ruff>=0.16.9",
]
